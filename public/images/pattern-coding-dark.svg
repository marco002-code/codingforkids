<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Blueprint Grid Lines (Light for Dark Backdrops) -->
  <path d="M 180 0 L 0 0 0 180" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.10"/>
  <path d="M 90 0 L 90 180 M 0 90 L 180 90" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="3,3" stroke-opacity="0.08"/>
  
  <!-- Grid Corner Intersection Dots -->
  <circle cx="0" cy="0" r="2" fill="#38bdf8" fill-opacity="0.3"/>
  <circle cx="180" cy="0" r="2" fill="#38bdf8" fill-opacity="0.3"/>
  <circle cx="0" cy="180" r="2" fill="#38bdf8" fill-opacity="0.3"/>
  <circle cx="180" cy="180" r="2" fill="#38bdf8" fill-opacity="0.3"/>
  <circle cx="90" cy="90" r="1.5" fill="#facc15" fill-opacity="0.4"/>

  <!-- Code Syntax Elements (Crisp Monospace) -->
  <text x="18" y="32" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="900" fill="#38bdf8" fill-opacity="0.18">&lt;/&gt;</text>
  <text x="125" y="42" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="900" fill="#facc15" fill-opacity="0.18">{ }</text>
  <text x="24" y="82" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="900" fill="#38bdf8" fill-opacity="0.15">0110 1001</text>
  <text x="115" y="125" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="900" fill="#4ade80" fill-opacity="0.20">&gt;_</text>
  <text x="20" y="145" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="900" fill="#38bdf8" fill-opacity="0.15">if (game.play) {</text>
  <text x="42" y="165" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="900" fill="#facc15" fill-opacity="0.15">score += 10;</text>

  <!-- Circuit Trace Line with Node -->
  <path d="M 65 25 L 85 25 L 95 35 L 95 55" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.15"/>
  <circle cx="65" cy="25" r="2.5" fill="#38bdf8" fill-opacity="0.25"/>
  <circle cx="95" cy="55" r="2.5" fill="#facc15" fill-opacity="0.4"/>

  <text x="145" y="160" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="900" fill="#4ade80" fill-opacity="0.18">=&gt;</text>
</svg>
