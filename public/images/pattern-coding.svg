<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Blueprint Grid Lines -->
  <path d="M 180 0 L 0 0 0 180" fill="none" stroke="#0b2347" stroke-width="0.8" stroke-opacity="0.08"/>
  <path d="M 90 0 L 90 180 M 0 90 L 180 90" fill="none" stroke="#0b2347" stroke-width="0.5" stroke-dasharray="3,3" stroke-opacity="0.06"/>
  
  <!-- Grid Corner Intersection Dots -->
  <circle cx="0" cy="0" r="2" fill="#0b2347" fill-opacity="0.2"/>
  <circle cx="180" cy="0" r="2" fill="#0b2347" fill-opacity="0.2"/>
  <circle cx="0" cy="180" r="2" fill="#0b2347" fill-opacity="0.2"/>
  <circle cx="180" cy="180" r="2" fill="#0b2347" fill-opacity="0.2"/>
  <circle cx="90" cy="90" r="1.5" fill="#f59e0b" fill-opacity="0.25"/>

  <!-- Code Syntax Elements (Crisp Monospace) -->
  <!-- Tag </code > -->
  <text x="18" y="32" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="900" fill="#0b2347" fill-opacity="0.14">&lt;/&gt;</text>
  
  <!-- Brackets { } -->
  <text x="125" y="42" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="900" fill="#0b2347" fill-opacity="0.14">{ }</text>

  <!-- Binary Stream 01101 -->
  <text x="24" y="82" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="900" fill="#0b2347" fill-opacity="0.11">0110 1001</text>

  <!-- Terminal Prompt >_ -->
  <text x="115" y="125" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="900" fill="#0b2347" fill-opacity="0.14">&gt;_</text>

  <!-- Function / Scratch Puzzle Hint -->
  <text x="20" y="145" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="900" fill="#0b2347" fill-opacity="0.12">if (game.play) {</text>
  <text x="42" y="165" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="900" fill="#0b2347" fill-opacity="0.10">score += 10;</text>

  <!-- Small Scratch Puzzle Piece Silhouette -->
  <path d="M 125 72 L 140 72 C 143 72, 143 76, 146 76 C 149 76, 149 72, 152 72 L 165 72 L 165 85 L 125 85 Z" fill="#0b2347" fill-opacity="0.08"/>

  <!-- Circuit Trace Line with Node -->
  <path d="M 65 25 L 85 25 L 95 35 L 95 55" fill="none" stroke="#0b2347" stroke-width="1.2" stroke-opacity="0.10"/>
  <circle cx="65" cy="25" r="2.5" fill="#0b2347" fill-opacity="0.14"/>
  <circle cx="95" cy="55" r="2.5" fill="#f59e0b" fill-opacity="0.25"/>

  <!-- Logic Symbol & Arrow -->
  <text x="145" y="160" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="900" fill="#0b2347" fill-opacity="0.12">=&gt;</text>
</svg>

