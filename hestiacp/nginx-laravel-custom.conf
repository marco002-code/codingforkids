# ==============================================================================
# Custom Nginx Virtual Host Configuration untuk Laravel di HestiaCP
# Dapat diletakkan di: /home/%user%/conf/web/%domain%/nginx.conf_custom
# dan /home/%user%/conf/web/%domain%/nginx.ssl.conf_custom
# ==============================================================================

# Routing Laravel: Teruskan semua request ke index.php
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Cache static assets (CSS, JS, Fonts, Images)
location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|woff|woff2)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, no-transform";
}

# Proteksi file tersembunyi (.env, .git, dll)
location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
}

# Keamanan header tambahan
add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options "nosniff";
